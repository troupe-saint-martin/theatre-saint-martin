<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎟️ Scanner — Théâtre Saint Martin</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:system-ui;
  margin:0;
  padding:8px;
  text-align:center;
  background:linear-gradient(180deg,#f9f9f9,#e3f2fd);
  color:#111;
}
h1{
  color:#0d47a1;
  font-size:1.55rem;
  line-height:1.15;
  margin:8px 0 4px;
}
body > p{
  margin:4px 0 8px;
  font-size:.95rem;
  color:#555;
}
#reader{
  width:320px;
  margin:10px auto;
  border-radius:10px;
  overflow:hidden;
  display:none;
}
.panel{
  max-width:500px;
  margin:8px auto;
  background:#fff;
  padding:12px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.ok{color:#2e7d32;font-weight:900}
.err{color:#d32f2f;font-weight:900}
.warn{color:#ef6c00;font-weight:900}
button{
  padding:10px 12px;
  border-radius:9px;
  border:none;
  color:#fff;
  cursor:pointer;
  margin:4px;
  font-weight:800;
  font-size:.95rem;
}
.violet{background:#8e24aa}
.green{background:#2e7d32}
.blue{background:#1976d2}
.grey{background:#455a64}
.orange{background:#ef6c00}

#counter,#syncInfo{
  font-weight:800;
  color:#0d47a1;
}
#syncInfo{
  font-size:.9rem;
  margin-top:5px;
}
#details{
  margin-top:8px;
  text-align:left;
  background:#fff;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:.98rem;
}
.accordion{
  background:#1976d2;
  color:white;
  padding:10px;
  border-radius:9px;
  width:100%;
  max-width:500px;
  margin-top:8px;
}
.panel-acc{
  display:none;
  background:#fff;
  border-radius:0 0 10px 10px;
  max-width:500px;
  margin:0 auto 16px;
  overflow:auto;
}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.trash{cursor:pointer;color:#d32f2f;font-weight:bold}
.history-complete {
  background: #e8f5e9 !important;
  color: #1b5e20;
  font-weight: 800;
}
.history-complete td {
  border-bottom-color: #a5d6a7;
}
.history-count {
  font-weight: 950;
  white-space: nowrap;
}
.big-result{
  font-size:1.15rem;
  padding:10px;
  border-radius:10px;
  margin:6px 0 8px;
  background:#f5f5f5;
}
.small{
  font-size:.88rem;
  color:#666;
  line-height:1.3;
}

.handscanner-box{
  position:sticky;
  top:0;
  z-index:20;
  margin:6px auto 8px;
  padding:10px;
  max-width:500px;
  background:#fff;
  border:2px solid #90caf9;
  border-radius:14px;
  box-shadow:0 3px 14px rgba(0,0,0,.14);
}
.handscanner-title{
  font-weight:950;
  color:#0d47a1;
  margin-bottom:6px;
  font-size:1.15rem;
}
#handScannerInput{
  width:100%;
  padding:13px 12px;
  border:2px solid #90caf9;
  border-radius:10px;
  font-size:1.05rem;
  box-sizing:border-box;
  outline:none;
}
#handScannerInput:focus{
  border-color:#1976d2;
  box-shadow:0 0 0 3px rgba(25,118,210,.18);
}
.handscanner-actions{
  margin-top:7px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.handscanner-actions button{
  width:100%;
  margin:0;
}
#manualScanBtn{
  grid-column:1 / -1;
}
.handscanner-box .small{
  margin:7px 0 0;
  font-size:.82rem;
}

.compact-result{
  max-width:500px;
  margin:8px auto;
  background:#fff;
  padding:12px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.compact-result #status{
  font-size:1.15rem;
  margin:4px 0 8px;
}
.compact-result #counter{
  margin:4px 0;
}
.compact-result #syncInfo{
  margin:4px 0 8px;
}
.compact-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  max-width:500px;
  margin:8px auto;
}
.compact-actions button{
  width:100%;
  margin:0;
}
.sync-line{
  max-width:500px;
  margin:8px auto;
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
}
.sync-line button{
  width:100%;
  margin:0;
}
.scan-note{
  display:none;
}
.camera-only{
  display:none;
}

@media(max-width:600px){
  body{padding:4px}
  h1{font-size:1.2rem;margin:4px 0}
  #reader{width:100%;max-width:330px;margin:6px auto}
  .panel{padding:8px}
  th,td{font-size:.88rem}

  .compact-result{
    position:sticky;
    top:0;
    z-index:40;
    margin:4px auto 12px;
    padding:8px 9px;
    border:1px solid #bbdefb;
  }
  .compact-result #status{font-size:1rem;margin:0 0 2px}
  .compact-result #counter{font-size:.9rem;margin:0}
  .compact-result #syncInfo{display:none}
  #details{margin-top:5px;padding:7px;font-size:.9rem}
  .big-result{font-size:.98rem;padding:6px;margin:2px 0 4px}

  .handscanner-box{position:static;margin:4px auto 6px;padding:7px}
  .handscanner-title{font-size:1rem;margin-bottom:4px}
  #handScannerInput{padding:10px;font-size:.95rem}
  .handscanner-actions{gap:4px;margin-top:5px}
  .handscanner-actions button{padding:9px 6px;font-size:.84rem}

  .spectator-search-box{margin:6px auto;padding:8px}
  .spectator-search-box input{padding:10px 11px;font-size:15px}
  #spectatorSearchResults{margin-top:6px;max-height:220px}
  .spectator-ticket-card{margin-top:6px;padding:8px}

  .sync-line,.compact-actions{margin:6px auto}
  .sync-line button,.compact-actions button{padding:9px 7px;font-size:.86rem}
}

/* ✅ Dernier scan validé : bloc légèrement rosé pour le repérer d’un coup d’œil */
.compact-result.valid-ticket {
  background:#fff7f8 !important;
  border:2px solid #e6b8c3 !important;
  box-shadow:0 4px 14px rgba(132,55,77,.12);
}
.compact-result.valid-ticket #details {
  background:#fffdfd;
  border:1px solid #efd4db;
  border-radius:10px;
}
.compact-result.valid-ticket .big-result {
  background:#fbecef !important;
}

/* 🎟️ Billet déjà utilisé : bloc rose pâle */
.compact-result.used-ticket {
  background: #fdecef !important;
  border: 2px solid #f8bbd0;
}

.compact-result.used-ticket #details {
  background: #fff7fa !important;
  border: 1px solid #f5c6d6 !important;
}

.compact-result.used-ticket .big-result {
  background: #fce4ec !important;
}



/* === Retour visuel instantané après chaque scan === */
.scan-feedback{
  position:fixed;
  left:50%;
  top:18%;
  transform:translate(-50%,-8px) scale(.97);
  z-index:9999;
  width:min(88vw,520px);
  box-sizing:border-box;
  padding:18px 20px;
  border-radius:16px;
  border:2px solid transparent;
  box-shadow:0 10px 30px rgba(0,0,0,.20);
  text-align:center;
  font-size:clamp(1.25rem,5vw,2rem);
  font-weight:950;
  line-height:1.15;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease,transform .12s ease;
}
.scan-feedback.show{
  opacity:1;
  transform:translate(-50%,0) scale(1);
}
.scan-feedback.ok{
  background:#e8f5e9;
  color:#1b5e20;
  border-color:#81c784;
}
.scan-feedback.used{
  background:#fdecef;
  color:#9b1c31;
  border-color:#e7a6b2;
}
.scan-feedback.err{
  background:#fff1f0;
  color:#b3261e;
  border-color:#ef9a9a;
}
@media(max-width:600px){
  .scan-feedback{
    top:15%;
    width:92vw;
    padding:16px 14px;
    border-radius:14px;
  }
}

/* === Recherche rapide spectateur sans billet === */
.spectator-search-box{
  max-width:520px;
  margin:14px auto;
  padding:12px;
  border:1px solid #d6d6d6;
  border-radius:12px;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.spectator-search-box input{
  width:100%;
  box-sizing:border-box;
  padding:12px 13px;
  border:2px solid #8e24aa;
  border-radius:9px;
  font-size:17px;
  font-weight:700;
  outline:none;
}
.spectator-search-box input:focus{
  border-color:#6a1b9a;
  box-shadow:0 0 0 3px rgba(142,36,170,.12);
}
#spectatorSearchResults{
  display:none;
  margin-top:9px;
  border:1px solid #ddd;
  border-radius:9px;
  overflow:hidden;
  max-height:280px;
  overflow-y:auto;
  background:#fff;
}
.spectator-result-btn{
  width:100%;
  display:block;
  text-align:left;
  border:0;
  border-bottom:1px solid #eee;
  background:#fff;
  color:#222;
  padding:10px 12px;
  cursor:pointer;
}
.spectator-result-btn:last-child{border-bottom:0}
.spectator-result-btn:hover,.spectator-result-btn:focus{background:#f7f0fa}
.spectator-result-name{font-weight:900;font-size:16px}
.spectator-result-meta{font-size:13px;color:#555;margin-top:3px}
.spectator-ticket-card{
  display:none;
  margin-top:10px;
  padding:12px;
  border:2px solid #8e24aa;
  border-radius:10px;
  background:#faf5fc;
}
.spectator-ticket-card .manual-name{font-size:20px;font-weight:950;margin-bottom:8px}
.spectator-ticket-card .manual-seats{font-size:15px;margin-bottom:8px}
.spectator-ticket-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.spectator-ticket-actions button{flex:1;min-width:150px;padding:11px;border:0;border-radius:8px;font-weight:900;cursor:pointer;color:#fff}
#manualEntryValidate{background:#2e7d32}
#manualEntryValidate:disabled{background:#9e9e9e;cursor:not-allowed}
#manualEntryClose{background:#616161}
.manual-scan-count{font-weight:900;margin-top:8px}
.manual-search-empty{padding:11px;color:#666;font-size:14px}

</style>
</head>

<body>
<h1>🎭 Scanner billets</h1>

<div id="scanFeedback" class="scan-feedback" aria-live="assertive"></div>

<div class="compact-result">
  <p id="status">Chargement des données…</p>
  <p id="counter">Billets scannés : 0</p>
  <p id="syncInfo">Synchronisation en attente…</p>
  <div id="details" style="display:none;"></div>
</div>

<div id="reader" class="camera-only"></div>

<div class="handscanner-box">
  <div class="handscanner-title">🔫 Douchette Tera 8100</div>
  <input id="handScannerInput" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Clique ici puis scanne avec la douchette" />
  <div class="handscanner-actions">
    <button id="handScannerModeBtn" class="orange" type="button">🔫 Mode douchette</button>
    <button id="cameraModeBtn" class="green" type="button">📷 Mode caméra</button>
    <button id="manualScanBtn" class="blue" type="button">✅ Valider le code</button>
  </div>
</div>

<div class="spectator-search-box">
  <div class="handscanner-title">🔎 Spectateur sans billet</div>
  <input id="spectatorSearch" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Tape le nom (ex. DUPONT)" />
  <div id="spectatorSearchResults"></div>
  <div id="spectatorTicketCard" class="spectator-ticket-card"></div>
</div>


<div class="sync-line">
  <button id="syncBtn" class="blue">🔄 Synchroniser avant ouverture</button>
</div>

<div class="compact-actions">
  <button id="resetScanBtn" class="violet">♻️ Réinitialiser</button>
  <button id="gotoHome" class="grey">🏠 Tableau de bord</button>
</div>

<p class="small scan-note">Conseil : avant l’arrivée du public, appuie sur <b>Synchroniser</b>. Ensuite les scans sont validés en local, donc beaucoup plus vite.</p>

<button class="accordion">📜 Historique des scans</button>
<div class="panel-acc" id="historyPanel">
  <table>
    <thead><tr><th>Nom</th><th>Sièges</th><th>Date</th><th></th></tr></thead>
    <tbody id="historyTable"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzHCn3c-7oz9XyEqhQilz3bGbVJErMULw",
  authDomain: "theatre-saint-martin.firebaseapp.com",
  databaseURL: "https://theatre-saint-martin-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "theatre-saint-martin",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const TEST_SEATS_PATH = "spectacles/amies_2026_10_11/test_seats";

let scanner;
let scanning = false;
let handScannerMode = false;
let handScannerBusy = false;
let scanState = {};      // État local des billets déjà scannés
let validTickets = {};   // Réservations chargées depuis Firebase
let ticketBySeats = {};  // Accès rapide par sièges

const statusEl = document.getElementById("status");
const counterEl = document.getElementById("counter");
const detailsEl = document.getElementById("details");
const scanFeedbackEl = document.getElementById("scanFeedback");
const syncInfoEl = document.getElementById("syncInfo");
const handScannerInput = document.getElementById("handScannerInput");
const handScannerModeBtn = document.getElementById("handScannerModeBtn");
const cameraModeBtn = document.getElementById("cameraModeBtn");
const manualScanBtn = document.getElementById("manualScanBtn");
const spectatorSearch = document.getElementById("spectatorSearch");
const spectatorSearchResults = document.getElementById("spectatorSearchResults");
const spectatorTicketCard = document.getElementById("spectatorTicketCard");
let selectedManualTicketId = "";
let manualSearchActive = false;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>'"]/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;"
  }[char]));
}
function normalize(value) { return String(value || "").trim().toLowerCase(); }
function sortSeatIds(a, b) { return String(a).localeCompare(String(b), "fr", { numeric: true }); }
function normalizeSeats(value) {
  return String(value || "").split(",").map(s => s.trim()).filter(Boolean).sort(sortSeatIds).join(",");
}
function getScanned(){ return JSON.parse(localStorage.getItem("scannedTickets") || "[]"); }
function setScanned(v){ localStorage.setItem("scannedTickets", JSON.stringify(v)); }
function getScanState(){ return JSON.parse(localStorage.getItem("scanState") || "{}"); }
function setScanState(v){ localStorage.setItem("scanState", JSON.stringify(v)); }

function updateCounter(){ counterEl.textContent = "Billets scannés : " + getScanned().length; }

function beep(type = "ok") {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = type === "ok" ? 880 : 220;
    gain.gain.value = 0.08;
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, type === "ok" ? 120 : 250);
  } catch(e) {}
}
function vibrate(type = "ok") {
  try { if (navigator.vibrate) navigator.vibrate(type === "ok" ? 80 : [120, 80, 120]); } catch(e) {}
}

function normalizeSearch(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function getTicketScanCount(ticketId) {
  return Number((scanState?.[ticketId] || {}).count || 0);
}

function getPaymentShortLabel(ticket = {}) {
  const amountValue = Number(ticket.amount || 0);
  if (amountValue <= 0) return "Gratuit / aucun règlement";
  return ticket.paid ? "Payé" : `${amountValue.toFixed(2).replace(".", ",")} € à encaisser`;
}

function renderSpectatorSearchResults() {
  if (!spectatorSearch || !spectatorSearchResults) return;
  const query = normalizeSearch(spectatorSearch.value);
  spectatorSearchResults.innerHTML = "";

  if (!query) {
    spectatorSearchResults.style.display = "none";
    return;
  }

  const matches = Object.values(validTickets || {})
    .filter(ticket => normalizeSearch(ticket.nom).includes(query))
    .sort((a, b) => String(a.nom || "").localeCompare(String(b.nom || ""), "fr", { sensitivity: "base" }))
    .slice(0, 20);

  spectatorSearchResults.style.display = "block";

  if (!matches.length) {
    spectatorSearchResults.innerHTML = `<div class="manual-search-empty">Aucun nom trouvé. Vérifie l’orthographe ou appuie sur Synchroniser.</div>`;
    return;
  }

  matches.forEach(ticket => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "spectator-result-btn";
    btn.dataset.ticketId = ticket.ticketId;

    const count = getTicketScanCount(ticket.ticketId);
    const scanText = `${count}/${Math.max(Number(ticket.maxScans || 1), 1)} entrée${Number(ticket.maxScans || 1) > 1 ? "s" : ""} validée${count > 1 ? "s" : ""}`;
    const testLabel = ticket.testReservation ? " · 🧪 TEST" : "";

    btn.innerHTML = `
      <div class="spectator-result-name">${escapeHTML(ticket.nom || "Participant")}${testLabel}</div>
      <div class="spectator-result-meta">🎟️ ${escapeHTML(ticket.sieges || "—")} · ${escapeHTML(getPaymentShortLabel(ticket))} · ${escapeHTML(scanText)}</div>
    `;
    btn.addEventListener("click", () => showManualTicket(ticket.ticketId));
    spectatorSearchResults.appendChild(btn);
  });
}

function showManualTicket(ticketId) {
  const ticket = validTickets?.[ticketId];
  if (!ticket || !spectatorTicketCard) return;

  selectedManualTicketId = ticketId;
  const count = getTicketScanCount(ticketId);
  const maxScans = Math.max(Number(ticket.maxScans || 1), 1);
  const complete = count >= maxScans;

  spectatorTicketCard.style.display = "block";
  spectatorTicketCard.innerHTML = `
    <div class="manual-name">${escapeHTML(ticket.nom || "Participant")}</div>
    <div class="manual-seats"><strong>🎟️ Sièges :</strong> ${escapeHTML(ticket.sieges || "—")}</div>
    <div class="manual-scan-count">Entrées validées : ${count}/${maxScans}</div>
    ${paymentStatusHtml(ticket)}
    <div class="spectator-ticket-actions">
      <button id="manualEntryValidate" type="button" ${complete ? "disabled" : ""}>
        ${complete ? "⛔ Toutes les entrées sont déjà validées" : "✅ Valider 1 entrée"}
      </button>
      <button id="manualEntryClose" type="button">Fermer</button>
    </div>
  `;

  spectatorSearchResults.style.display = "none";

  const validateBtn = document.getElementById("manualEntryValidate");
  const closeBtn = document.getElementById("manualEntryClose");

  if (validateBtn && !complete) {
    validateBtn.addEventListener("click", async () => {
      validateBtn.disabled = true;
      validateBtn.textContent = "Validation…";
      await onScanSuccess(`R:${ticketId}`, { restartCamera: !handScannerMode });
      renderSpectatorSearchResults();
      showManualTicket(ticketId);
    });
  }

  if (closeBtn) {
    closeBtn.addEventListener("click", () => {
      selectedManualTicketId = "";
      spectatorTicketCard.style.display = "none";
      spectatorTicketCard.innerHTML = "";
      if (spectatorSearch) spectatorSearch.value = "";
      if (spectatorSearchResults) spectatorSearchResults.style.display = "none";

      // La recherche est terminée : on rend la douchette immédiatement prête.
      manualSearchActive = false;
      if (handScannerMode) setTimeout(focusHandScannerInput, 80);
    });
  }
}

function activateSpectatorSearch() {
  manualSearchActive = true;
  if (handScannerInput) handScannerInput.blur();
  if (!spectatorSearch) return;

  // Cet appel part directement du toucher de l'utilisateur : sur Android,
  // il permet au clavier virtuel d'apparaître malgré la douchette Bluetooth HID.
  try {
    spectatorSearch.focus({ preventScroll: true });
  } catch (e) {
    spectatorSearch.focus();
  }
  try {
    if (navigator.virtualKeyboard && typeof navigator.virtualKeyboard.show === "function") {
      navigator.virtualKeyboard.show();
    }
  } catch (e) {}
}

if (spectatorSearch) {
  spectatorSearch.addEventListener("pointerdown", activateSpectatorSearch);
  spectatorSearch.addEventListener("click", activateSpectatorSearch);
  spectatorSearch.addEventListener("focus", () => { manualSearchActive = true; });

  spectatorSearch.addEventListener("input", () => {
    selectedManualTicketId = "";
    if (spectatorTicketCard) {
      spectatorTicketCard.style.display = "none";
      spectatorTicketCard.innerHTML = "";
    }
    renderSpectatorSearchResults();
  });

  spectatorSearch.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      spectatorSearch.value = "";
      renderSpectatorSearchResults();
      if (spectatorTicketCard) spectatorTicketCard.style.display = "none";
    }
  });
}

function renderHistory(){
  const list = getScanned();
  const state = getScanState();
  const tbody = document.getElementById("historyTable");
  tbody.innerHTML = "";

  const grouped = {};
  list.forEach(item => {
    if (!grouped[item.ticketId]) {
      const savedState = state[item.ticketId] || {};
      grouped[item.ticketId] = {
        nom: item.nom,
        sieges: item.sieges,
        count: 0,
        maxScans: Number(item.maxScans || savedState.maxScans || 1),
        lastDate: item.date
      };
    }
    grouped[item.ticketId].count++;
    grouped[item.ticketId].lastDate = item.date;

    const savedState = state[item.ticketId] || {};
    const max = Number(item.maxScans || savedState.maxScans || grouped[item.ticketId].maxScans || 1);
    if (max > grouped[item.ticketId].maxScans) grouped[item.ticketId].maxScans = max;
  });

  Object.entries(grouped).forEach(([ticketId, item]) => {
    const maxScans = Math.max(Number(item.maxScans || 1), 1);
    const isComplete = Number(item.count || 0) >= maxScans;

    const tr = document.createElement("tr");
    if (isComplete) tr.classList.add("history-complete");

    tr.innerHTML = `
      <td>${escapeHTML(item.nom)}</td>
      <td>${escapeHTML(item.sieges)}</td>
      <td>${escapeHTML(item.lastDate)}</td>
      <td>
        <strong class="history-count">${item.count}/${maxScans}</strong>
        <span class="trash" style="margin-left:8px;">🗑️</span>
      </td>
    `;
    tbody.appendChild(tr);

    tr.querySelector(".trash").onclick = async () => {
      const local = getScanned();
      const idx = local.map(s => s.ticketId).lastIndexOf(ticketId);
      if (idx !== -1) { local.splice(idx, 1); setScanned(local); }

      scanState = getScanState();
      if (scanState[ticketId]) {
        const nextCount = Math.max(0, Number(scanState[ticketId].count || 0) - 1);
        if (nextCount <= 0) {
          delete scanState[ticketId];
          await set(ref(db, "scans/" + ticketId), null);
        } else {
          scanState[ticketId].count = nextCount;
          scanState[ticketId].lastScan = Date.now();
          await set(ref(db, "scans/" + ticketId), scanState[ticketId]);
        }
        setScanState(scanState);
      }

      renderHistory();
      updateCounter();
    };
  });
}

async function startScanner(){
  if (handScannerMode) return;
  if (scanning) return;
  scanning = true;
  try {
    if (!scanner) scanner = new Html5Qrcode("reader");
    await scanner.start({facingMode:"environment"}, {fps:12, qrbox:250}, onScanSuccess);
  } catch (err) {
    scanning = false;
    statusEl.innerHTML = "<span class='err'>❌ Caméra indisponible. Vérifie l’autorisation caméra.</span>";
    console.error(err);
  }
}
async function stopScanner(){
  try { if(scanner && scanning) await scanner.stop(); } catch(e) { console.warn("Arrêt scanner impossible", e); }
  scanning = false;
}

function isReservationIdWithOnlyMissingChars(receivedId, fullId, maxMissing = 2) {
  const received = String(receivedId || "").trim();
  const full = String(fullId || "").trim();

  // Sécurité : on ne tente jamais de rapprochement sur un identifiant court.
  if (received.length < 20 || full.length < 20) return false;

  const missingCount = full.length - received.length;
  if (missingCount < 1 || missingCount > maxMissing) return false;

  // Le code reçu doit être exactement l'identifiant connu auquel il manque
  // seulement 1 ou 2 caractères, dans le même ordre. Aucun remplacement accepté.
  let i = 0;
  for (let j = 0; j < full.length && i < received.length; j++) {
    if (received[i] === full[j]) i++;
  }
  return i === received.length;
}

function findUniqueTicketWithMissingChars(receivedId) {
  const matches = Object.entries(validTickets || {}).filter(([ticketId]) =>
    isReservationIdWithOnlyMissingChars(receivedId, ticketId, 2)
  );

  // Garde-fou essentiel : aucune correction si plusieurs billets pourraient correspondre.
  if (matches.length !== 1) return null;

  const [ticketId, ticket] = matches[0];
  return { ticketId, ticket };
}

function parseQrText(text) {
  let rawText = String(text || "").trim();

  // Nettoyage des caractères envoyés par la douchette / certains lecteurs QR.
  // Certains appareils restituent les underscores sous la forme \_.
  // On les normalise sans modifier le contenu des billets existants.
  rawText = rawText.replace(/[\r\n\t]/g, "").replace(/\\_/g, "_").trim();

  let data = null;
  let reservationId = "";
  let sieges = "";

  // Nouveau QR court :
  // Exemple : R:test_4_b6e1a634-4839-45f2-809d-70bb05136cac
  // On enlève "R:" avant de chercher dans Firebase.
  if (/^R:/i.test(rawText)) {
    reservationId = rawText.slice(2).trim();
  }

  // Lien éventuel vers b.html?r=...
  if (!reservationId && /^https?:\/\//i.test(rawText)) {
    try {
      const url = new URL(rawText);
      reservationId = (url.searchParams.get("r") || url.searchParams.get("reservationId") || "").trim();
    } catch(e) {}
  }

  // Ancien QR long JSON : compatibilité gardée.
  if (!reservationId) {
    try {
      data = JSON.parse(rawText);
      reservationId = data?.reservationId || data?.id || data?.r || "";
      sieges = data?.sieges || data?.seats || data?.places || "";
    } catch(e) {}
  }

  // Dernier recours : ancien identifiant brut sans R:
  if (!reservationId && !sieges) {
    reservationId = rawText;
  }

  const normalizedSeatKey = normalizeSeats(sieges);
  let ticketFromReservation = reservationId ? validTickets[reservationId] : null;
  let recoveredMissingChars = false;

  // Si la douchette Bluetooth a perdu seulement 1 ou 2 caractères, on accepte
  // UNIQUEMENT s'il existe une seule réservation connue compatible.
  if (!ticketFromReservation && reservationId && Object.keys(validTickets).length) {
    const recovered = findUniqueTicketWithMissingChars(reservationId);
    if (recovered) {
      ticketFromReservation = recovered.ticket;
      reservationId = recovered.ticketId;
      recoveredMissingChars = true;
    }
  }

  const ticketFromSeats = normalizedSeatKey ? ticketBySeats[normalizedSeatKey] : null;
  const matchedTicket = ticketFromReservation || ticketFromSeats || null;
  const ticketId = matchedTicket?.ticketId || reservationId || normalizedSeatKey || rawText;
  const resolvedSeats = matchedTicket?.sieges || sieges || "";
  const seatCount = String(resolvedSeats || "").split(",").map(s => s.trim()).filter(Boolean).length;

  return {
    raw: rawText,
    data,
    matchedTicket,
    recoveredMissingChars,
    ticketId,
    nom: matchedTicket?.nom || data?.nom || data?.name || "Participant",
    email: matchedTicket?.email || data?.email || "",
    phone: matchedTicket?.phone || data?.tel || data?.phone || "",
    sieges: resolvedSeats,
    paid: matchedTicket ? !!matchedTicket.paid : !!data?.paid,
    amount: Number(matchedTicket?.amount ?? data?.amount ?? 0),
    octoberRoseCount: Number(matchedTicket?.octoberRoseCount ?? data?.octoberRoseCount ?? 0),
    maxScans: Math.max(seatCount || 1, 1),
    isKnownTicket: !!matchedTicket || Object.keys(validTickets).length === 0
  };
}

async function persistScan(ticketId) {
  const item = scanState[ticketId];
  if (!item) return;
  try { await set(ref(db, "scans/" + ticketId), item); syncInfoEl.textContent = "✅ Dernier scan sauvegardé dans Firebase."; }
  catch (err) { console.warn("Scan non sauvegardé immédiatement", err); syncInfoEl.textContent = "⚠️ Scan gardé sur ce téléphone. Resynchronise dès que le réseau revient."; }
}



let scanFeedbackTimer = null;
function showScanFeedback(type, text) {
  if (!scanFeedbackEl) return;
  clearTimeout(scanFeedbackTimer);
  scanFeedbackEl.className = `scan-feedback ${type}`;
  scanFeedbackEl.textContent = text;
  // Force le navigateur à repartir de l'état masqué pour que chaque scan soit visible.
  void scanFeedbackEl.offsetWidth;
  scanFeedbackEl.classList.add("show");
  scanFeedbackTimer = setTimeout(() => {
    scanFeedbackEl.classList.remove("show");
  }, 950);
}

function setUsedTicketVisual(isUsed) {
  const box = document.querySelector(".compact-result");
  if (!box) return;
  box.classList.toggle("used-ticket", !!isUsed);
  if (isUsed) box.classList.remove("valid-ticket");
}

function setValidTicketVisual(isValid) {
  const box = document.querySelector(".compact-result");
  if (!box) return;
  box.classList.toggle("valid-ticket", !!isValid);
  if (isValid) box.classList.remove("used-ticket");
}

function paymentStatusHtml(ticket = {}) {
  const amountValue = Number(ticket.amount || 0);
  const amount = amountValue.toFixed(2).replace(".", ",");
  const octoberRoseCount = Number(ticket.octoberRoseCount || 0);
  const octoberRoseHtml = octoberRoseCount > 0
    ? `<div style="margin-top:10px;padding:10px;border-radius:9px;background:#fff0f6;color:#ad1457;font-weight:950;">🎀 OCTOBRE ROSE — ${octoberRoseCount} place(s) association</div>`
    : "";

  if (amountValue <= 0) {
    return octoberRoseHtml + `<div style="margin-top:10px;padding:10px;border-radius:9px;background:#e8f5e9;color:#1b5e20;font-weight:900;">✅ Aucun règlement à encaisser</div>`;
  }
  if (ticket.paid) {
    return octoberRoseHtml + `<div style="margin-top:10px;padding:10px;border-radius:9px;background:#e8f5e9;color:#1b5e20;font-weight:900;">✅ Paiement reçu</div>`;
  }
  return octoberRoseHtml + `<div style="margin-top:10px;padding:10px;border-radius:9px;background:#fff3e0;color:#bf360c;font-weight:950;">⚠️ PAIEMENT NON REÇU — ${amount} € À ENCAISSER</div>`;
}

async function onScanSuccess(text, options = {}){
  const restartCameraAfterScan = options.restartCamera !== false;
  await stopScanner();
  const ticket = parseQrText(text);
  const current = scanState[ticket.ticketId] || { count: 0, nom: ticket.nom, sieges: ticket.sieges, lastScan: 0 };
  if (!ticket.isKnownTicket) {
    beep("err"); vibrate("err");
    statusEl.innerHTML = "<span class='err'>⛔ Billet non reconnu</span>";
    showScanFeedback("err", "❌ BILLET NON RECONNU");
    setUsedTicketVisual(false);
    setValidTicketVisual(false);
    detailsEl.style.display = "block";
    detailsEl.innerHTML = `<div class="big-result">Ce QR code ne correspond à aucune réservation chargée.</div><strong>Données lues :</strong><br>Nom : ${escapeHTML(ticket.nom)}<br>Sièges : ${escapeHTML(ticket.sieges || "—")}`;
    if (restartCameraAfterScan) setTimeout(startScanner, 900); else setTimeout(focusHandScannerInput, 120);
    return;
  }
  if (Number(current.count || 0) >= ticket.maxScans) {
    beep("err"); vibrate("err");
    statusEl.innerHTML = "<span class='err'>⛔ Billet déjà utilisé</span>";
    showScanFeedback("used", `⛔ DÉJÀ SCANNÉ — ${current.count}/${ticket.maxScans}`);
    setUsedTicketVisual(true);
    setValidTicketVisual(false);
    detailsEl.style.display = "block";
    detailsEl.innerHTML = `<div class="big-result">Déjà scanné ${current.count}/${ticket.maxScans}</div><strong>Réservation :</strong><br><b>${escapeHTML(current.nom || ticket.nom)}</b><hr><strong>🎟️ Sièges :</strong> ${escapeHTML(current.sieges || ticket.sieges)}${paymentStatusHtml(ticket)}`;
    if (restartCameraAfterScan) setTimeout(startScanner, 900); else setTimeout(focusHandScannerInput, 120);
    return;
  }
  current.count = Number(current.count || 0) + 1;
  current.nom = ticket.nom || current.nom || "Participant";
  current.sieges = ticket.sieges || current.sieges || "";
  current.email = ticket.email || current.email || "";
  current.phone = ticket.phone || current.phone || "";
  current.paid = !!ticket.paid;
  current.amount = Number(ticket.amount || 0);
  current.octoberRoseCount = Number(ticket.octoberRoseCount || 0);
  current.maxScans = ticket.maxScans;
  current.lastScan = Date.now();
  scanState[ticket.ticketId] = current;
  setScanState(scanState);
  const list = getScanned();
  list.push({ ticketId: ticket.ticketId, nom: current.nom, sieges: current.sieges, maxScans: ticket.maxScans, date: new Date().toLocaleString() });
  setScanned(list);
  renderHistory(); updateCounter();
  beep("ok"); vibrate("ok");
  statusEl.innerHTML = `<span class='ok'>✅ Scan ${current.count}/${ticket.maxScans}${ticket.recoveredMissingChars ? " — lecture récupérée" : ""}</span>`;
  showScanFeedback("ok", `✅ SCAN VALIDÉ — ${current.count}/${ticket.maxScans}`);
  setUsedTicketVisual(false);
  setValidTicketVisual(true);
  detailsEl.style.display = "block";
  detailsEl.innerHTML = `<div class="big-result ok">Entrée validée</div><strong>Réservation au nom de :</strong><br><b>${escapeHTML(current.nom)}</b><hr><strong>🎟️ Sièges :</strong> ${escapeHTML(current.sieges || "—")}${paymentStatusHtml(ticket)}`;
  persistScan(ticket.ticketId);
  if (restartCameraAfterScan) setTimeout(startScanner, 650); else setTimeout(focusHandScannerInput, 120);
}


function focusHandScannerInput() {
  if (!handScannerInput) return;

  // Ne jamais voler le focus pendant qu'on recherche un spectateur au clavier.
  if (manualSearchActive || document.activeElement === spectatorSearch) return;

  try {
    handScannerInput.focus({ preventScroll: true });
    handScannerInput.select();
  } catch(e) {
    handScannerInput.focus();
  }
}

async function activateHandScannerMode() {
  manualSearchActive = false;
  handScannerMode = true;
  await stopScanner();
  const reader = document.getElementById("reader");
  if (reader) reader.style.display = "none";
  statusEl.innerHTML = "<span class='ok'>🔫 Mode douchette actif. Scanne dans le champ.</span>";
  syncInfoEl.textContent = "Douchette Tera 8100 : prête à recevoir un QR code.";
  focusHandScannerInput();
}

async function activateCameraMode() {
  manualSearchActive = false;
  handScannerMode = false;
  const reader = document.getElementById("reader");
  if (reader) reader.style.display = "block";
  statusEl.innerHTML = "<span class='ok'>📷 Mode caméra actif.</span>";
  await startScanner();
}

async function processHandScannerValue() {
  if (!handScannerInput || handScannerBusy) return;
  const value = handScannerInput.value.trim();
  if (!value) return;

  handScannerBusy = true;
  handScannerInput.value = "";

  try {
    await onScanSuccess(value, { restartCamera: false });
  } finally {
    handScannerBusy = false;
    setTimeout(focusHandScannerInput, 120);
  }
}

if (handScannerInput) {
  handScannerInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();
      processHandScannerValue();
    }
  });

  // Certaines douchettes Bluetooth écrivent très lentement caractère par caractère.
  // On attend donc une vraie fin de saisie avant de valider automatiquement,
  // sinon un QR partiel peut être pris pour un billet complet.
  let handScannerTimer = null;
  handScannerInput.addEventListener("input", () => {
    clearTimeout(handScannerTimer);
    handScannerTimer = setTimeout(() => {
      const value = handScannerInput.value.trim();
      if (!value) return;

      // Si la douchette n'envoie ni Entrée ni Tab, on valide seulement
      // Après 250 ms sans nouveau caractère, on valide le code.
      // Ce délai court est adapté aux téléphones et douchettes rapides.
      processHandScannerValue();
    }, 250);
  });
}
if (handScannerModeBtn) handScannerModeBtn.onclick = activateHandScannerMode;
if (cameraModeBtn) cameraModeBtn.onclick = activateCameraMode;
if (manualScanBtn) manualScanBtn.onclick = processHandScannerValue;

document.querySelector(".accordion").onclick=()=>{
  const p=document.getElementById("historyPanel");
  p.style.display=p.style.display==="block"?"none":"block";
};
document.getElementById("gotoHome").onclick = () => { window.location.href = "index.html"; };

document.getElementById("resetScanBtn").onclick = async () => {
  const autoAdmin = localStorage.getItem("ADMIN_AUTO_LOGIN") === "true";
  const pwd = autoAdmin ? "admin123" : prompt("🔐 Entrez le mot de passe administrateur pour réinitialiser :");
  if (pwd !== "admin123") return alert("❌ Mot de passe incorrect.");
  if (!confirm("Tout effacer (Firebase + historique local) ?")) return;
  await set(ref(db, "scans"), null);
  localStorage.removeItem("scannedTickets");
  localStorage.removeItem("scanState");
  scanState = {};
  renderHistory(); updateCounter();
  statusEl.innerHTML = "<span class='ok'>✅ Historique réinitialisé.</span>";
  setUsedTicketVisual(false);
};

async function syncScansFromFirebase() {
  const snap = await get(ref(db, "scans"));
  const state = {};
  const list = [];
  if (snap.exists()) {
    const data = snap.val() || {};
    Object.entries(data).forEach(([ticketId, v]) => {
      const count = Number(v.count || 0);
      state[ticketId] = { count, nom: v.nom || "Participant", sieges: v.sieges || "", email: v.email || "", phone: v.phone || "", maxScans: Number(v.maxScans || 1), lastScan: Number(v.lastScan || Date.now()) };
      for (let i = 0; i < count; i++) list.push({ ticketId, nom: state[ticketId].nom, sieges: state[ticketId].sieges, maxScans: state[ticketId].maxScans, date: new Date(state[ticketId].lastScan || Date.now()).toLocaleString() });
    });
  }
  scanState = state;
  setScanState(scanState);
  setScanned(list);
}

async function syncReservationsFromFirebase() {
  validTickets = {};
  ticketBySeats = {};

  const [realSnap, testSnap] = await Promise.all([
    get(ref(db, "seats")),
    get(ref(db, TEST_SEATS_PATH))
  ]);

  const grouped = {};

  function addSeatsToGroup(seatsData = {}, isTestSource = false) {
    Object.entries(seatsData || {}).forEach(([seatId, data]) => {
      if (!data) return;
      const reservationId = data.reservationId || "";
      const key = reservationId || `${normalize(data.email)}__${normalize(data.name)}__${normalize(data.phone)}`;
      if (!key || key === "____") return;

      if (!grouped[key]) {
        grouped[key] = {
          ticketId: reservationId || key,
          reservationId,
          nom: data.name || "Participant",
          email: data.email || "",
          phone: data.phone || "",
          sieges: [],
          paid: true,
          amount: Number(data.amount || 0),
          octoberRoseCount: 0,
          testReservation: isTestSource || data.testReservation === true || data.source === "test_data"
        };
      }

      grouped[key].sieges.push(seatId);
      grouped[key].paid = grouped[key].paid && !!data.paid;
      if (data.type === "octobre_rose") grouped[key].octoberRoseCount += 1;

      if (!grouped[key].reservationId && data.reservationId) grouped[key].reservationId = data.reservationId;
      if (!grouped[key].email && data.email) grouped[key].email = data.email;
      if (!grouped[key].phone && data.phone) grouped[key].phone = data.phone;
      if (!grouped[key].nom && data.name) grouped[key].nom = data.name;
      if (!grouped[key].amount && data.amount) grouped[key].amount = Number(data.amount || 0);
    });
  }

  if (realSnap.exists()) addSeatsToGroup(realSnap.val() || {}, false);
  if (testSnap.exists()) addSeatsToGroup(testSnap.val() || {}, true);

  Object.values(grouped).forEach(ticket => {
    ticket.sieges = ticket.sieges.sort(sortSeatIds).join(", ");
    ticket.maxScans = Math.max(ticket.sieges.split(",").filter(Boolean).length, 1);

    // Toutes les réservations confirmées sont des billets valides, même si elles ne sont pas encore payées.
    // Le paiement reste affiché séparément au moment du scan.

    validTickets[ticket.ticketId] = ticket;
    ticketBySeats[normalizeSeats(ticket.sieges)] = ticket;
  });

  localStorage.setItem("validTicketsLoadedAt", new Date().toISOString());
  localStorage.setItem("validTicketsCount", String(Object.keys(validTickets).length));
  return Object.keys(validTickets).length;
}

async function fullSync() {
  statusEl.innerHTML = "🔄 Synchronisation en cours…";
  syncInfoEl.textContent = "Chargement réservations + historique scans…";
  try {
    const [ticketCount] = await Promise.all([ syncReservationsFromFirebase(), syncScansFromFirebase() ]);
    renderHistory(); updateCounter();
    const now = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    syncInfoEl.textContent = `✅ Synchronisé à ${now} — ${ticketCount} billet${ticketCount > 1 ? "s" : ""} chargé${ticketCount > 1 ? "s" : ""}.`;
    statusEl.innerHTML = "<span class='ok'>Prêt à scanner.</span>";
    setUsedTicketVisual(false);
    if (spectatorSearch && spectatorSearch.value.trim()) renderSpectatorSearchResults();
    if (selectedManualTicketId && validTickets[selectedManualTicketId]) showManualTicket(selectedManualTicketId);
  } catch (err) {
    console.error("Erreur synchronisation", err);
    syncInfoEl.textContent = "⚠️ Synchronisation Firebase impossible. Les scans locaux restent disponibles.";
    statusEl.innerHTML = "<span class='warn'>Mode local actif.</span>";
    scanState = getScanState();
    renderHistory(); updateCounter();
  }
}

document.getElementById("syncBtn").onclick = fullSync;
window.onload = async () => { await fullSync(); activateHandScannerMode(); };
</script>
